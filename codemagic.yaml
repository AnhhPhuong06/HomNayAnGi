workflows:
  ios-unsigned:
    name: iOS Release - Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.9
      xcode: latest
      vars:
        BYPASS_PERMISSION_LOCATION_ALWAYS: "1"
    scripts:
      - name: Resolve Flutter dependencies
        script: |
          flutter config --enable-swift-package-manager
          flutter pub get --enforce-lockfile
      - name: Analyze and test
        script: |
          set -euo pipefail
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build unsigned iOS Release
        script: flutter build ios --release --no-codesign --no-pub
      - name: Package unsigned IPA
        script: bash ios/package_unsigned_ipa.sh
    artifacts:
      - build/ios/ipa/*-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
