name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      account_configuration:
        description: 'configured requires Firebase; compile-only keeps login unavailable'
        type: choice
        default: configured
        options:
          - configured
          - compile-only

permissions:
  contents: read

jobs:
  ios:
    name: iOS Release - Unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      BYPASS_PERMISSION_LOCATION_ALWAYS: "1"
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
      - name: Verify Xcode 26.3 and Swift toolchain
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
          xcrun swift --version
      - name: Test account configuration script
        run: python3 -m unittest discover -s tool -p 'test_configure_ios_accounts.py'
      - name: Prepare account configuration
        if: inputs.account_configuration != 'compile-only'
        env:
          FIREBASE_IOS_CONFIG_JSON: ${{ secrets.FIREBASE_IOS_CONFIG_JSON }}
        run: python3 tool/configure_ios_accounts.py --from-env
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: |
          xcodebuild -version
          flutter config --enable-swift-package-manager
          flutter pub get --enforce-lockfile
      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub --concurrency=1
      - name: Build unsigned iOS Release
        env:
          ACCOUNT_CONFIGURATION: ${{ inputs.account_configuration }}
        run: |
          if [[ "$ACCOUNT_CONFIGURATION" == "compile-only" ]]; then
            echo '::warning::Compile-only IPA: account service is unavailable in this artifact.'
            flutter build ios --release --no-codesign --no-pub
          else
            flutter build ios --release --no-codesign --no-pub --dart-define-from-file=config/firebase.ios.json
          fi
      - name: Package IPA
        run: bash ios/package_unsigned_ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hom_nay_an_gi-unsigned
          path: build/ios/ipa/hom_nay_an_gi-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
