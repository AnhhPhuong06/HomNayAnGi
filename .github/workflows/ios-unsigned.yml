name: Build unsigned IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios:
    name: iOS Release - Unsigned IPA
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      BYPASS_PERMISSION_LOCATION_ALWAYS: "1"
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: "3.47.9"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: |
          xcodebuild -version
          flutter config --enable-swift-package-manager
          flutter pub get --enforce-lockfile
      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build unsigned iOS Release
        run: flutter build ios --release --no-codesign --no-pub
      - name: Package IPA
        run: bash ios/package_unsigned_ipa.sh
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hom_nay_an_gi-unsigned
          path: build/ios/ipa/hom_nay_an_gi-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
